<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEACHER</title>
  <link rel="stylesheet" href="css/teachers.css" />
  <link rel="stylesheet" href="css/announcements.css">

  <link rel="icon" type="image/png" href="/images/favicon.png"/> 
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

 
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="teacher-header">
    <div class="header-left">
      <h1>WELCOME, <span id="teacherName"></span></h1>
      <span id="schoolName" class="school-pill"></span> 
    </div>
    <div class="header-right">
      <a href="/dean" id="deanDashboardBtn" class="btn dean-btn" style="display:none;">🎓 Dean Dashboard</a>
      <button id="logoutBtn" class="btn secondary-btn">Logout</button>
    </div>
  </header>

<div id="toastContainer"></div>
  <main>
    <!-- =================== MY ALLOCATIONS =================== -->
    <section class="allocations-section">
      <div id="allocationsContainer" class="allocations-grid"></div>
    </section>

    <!-- TABS NAVIGATION -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="enterMarks">📊 Enter Marks</button>
      <button class="tab-btn" data-tab="submittedMarks">📋 Submitted Marks</button>
      <button class="tab-btn" data-tab="studyMaterials">📚 Study Materials</button>
    </div>

    <div id="enterMarks" class="tab-pane active">
    <!-- =================== MARKS ENTRY (TABLE-BASED) =================== -->
    <section class="marks-section">
      <h2>📊 ENTER LEARNERS MARKS</h2>
      
      <!-- Step 1: Select Subject/Class Allocation -->
      <div class="marks-controls">
        <div class="section-header">
          <h3>Step 1: Select Your Subject/Grade & Assessment</h3>
        
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Subject & Grade</label>
            <select id="subjectAllocationSelect" required>
              <option value="">-- Select Subject/Grade --</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Term</label>
            <select id="marksTermSelect" required>
              <option value="">-- Select Term --</option>
              <option value="1">Term 1</option>
              <option value="2">Term 2</option>
              <option value="3">Term 3</option>
            </select>
          </div>

          <div class="form-group">
            <label>Assessment</label>
            <select id="marksAssessmentSelect" required></select>
          </div>

          <div class="form-group">
            <label>Year</label>
            <input style="width: 50px;" type="number" id="marksYearInput" min="2025" max="2090" readonly />
          </div>
        </div>
        <div id="termLockMessage" class="inline-alert" style="display: none;">
          <!-- Message will be inserted here by JavaScript -->
        </div>
          <button type="button" id="loadStudentsBtn" class="btn accent-btn">📥 Load Learners</button>
      </div>

      <!-- Step 2: Marks Entry Table -->
      <div id="marksTableContainer" style="display: none;">
        <h3>Step 2: Enter Marks for Each Learner</h3>
        <div id="marksEntryScrollWrapper" class="marks-entry-scroll-wrapper">
          <table id="marksEntryTable" class="marks-entry-table">
            <thead>
              <tr>
                <th style="width: 5%;">ADM No</th>
                <th style="width: 10%;">Learner's Name</th>
                <th style="width: 8%;" id="marksColumnHeader">Marks</th>
              </tr>
            </thead>
            <tbody id="marksEntryTableBody">
              <!-- Students will be populated here -->
            </tbody>
          </table>
        </div>

        <div class="actions-row">
          <div class="btn-group">
            <button type="button" id="saveDraftBtn" class="btn warning-btn">💾 Save Draft</button>
            <button type="button" id="loadDraftBtn" class="btn primary-btn" style="display: none;">📂 Load Draft</button>
          </div>
          <button type="button" id="submitAllMarksBtn" class="btn primary-btn submit-btn">✅ Submit All Marks</button>
        </div>

        <!-- Draft Status Indicator -->
        <div id="draftStatus" class="draft-status" style="display: none;">
          ✓ Draft saved at <span id="draftTime"></span>
        </div>
      </div>
    </section>
    </div>

    <div id="submittedMarks" class="tab-pane">
    <!-- =================== SUBMITTED MARKS TABLES =================== -->
    <section class="marks-table">
      <details open class="collapsible-card">
        <summary class="collapsible-header">
          <h2>📊 SUBMITTED MARKS</h2>
          <span class="summary-note">(Click to Collapse/Expand)</span>
        </summary>
        <div class="collapsible-body">
          <div id="submittedMarksContainer"></div>
        </div>
      </details>
    </section>
    </div>

    <div id="studyMaterials" class="tab-pane">
    <!-- =================== STUDY MATERIALS =================== -->
    <section class="materials-section">
      <div class="material-card">
        <h3>📚 Study Materials & Assignments</h3>
        <a href="/teacher-materials" class="btn primary-btn big-btn">🚀 Go to Materials Dashboard</a>
      </div>
    </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth-service.js"></script>
   <script src="js/announcements.js"></script>
  <script src="js/cbc-utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/subject-data.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
