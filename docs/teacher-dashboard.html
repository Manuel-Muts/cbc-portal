<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEACHER</title>
  <link rel="stylesheet" href="css/teachers.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077012.png" />
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch !important;
        padding: 15px !important;
        gap: 12px !important;
      }
      header h1 {
        white-space: normal !important;
        font-size: 1rem !important;
        line-height: 1.4;
      }
      header > div:first-child {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 8px !important;
      }
    }
  </style>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  
  <header style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 20px; gap: 15px; border-bottom: 1px solid #edf2f7; background: #fff; position: sticky; top: 0; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
      <h1 style="margin: 0; font-size: 1.1rem; color: #2d3748; white-space: nowrap;">WELCOME, <span id="teacherName"></span></h1>
      <span id="schoolName" style="background: #ebf8ff; color: #2b6cb0; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; border: 1px solid #bee3f8; text-transform: uppercase;"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="dean-dashboard.html" id="deanDashboardBtn" class="btn" style="display:none; background: #8e44ad; text-decoration: none; margin: 0; padding: 8px 15px; font-size: 0.9rem;">🎓 Dean Dashboard</a>
      <button id="logoutBtn" style="margin: 0; padding: 8px 15px; font-size: 0.9rem;">Logout</button>
    </div>
  </header>

<div id="toastContainer"></div>
  <main>
    <!-- =================== MY ALLOCATIONS =================== -->
    <section class="allocations-section">
      <div id="allocationsContainer" style="margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch;">
      </div>
    </section>

    <!-- TABS NAVIGATION -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="enterMarks">📊 Enter Marks</button>
      <button class="tab-btn" data-tab="submittedMarks">📋 Submitted Marks</button>
      <button class="tab-btn" data-tab="studyMaterials">📚 Study Materials</button>
    </div>

    <div id="enterMarks" class="tab-pane active">
    <!-- =================== MARKS ENTRY (TABLE-BASED) =================== -->
    <section class="marks-section">
      <h2>📊 ENTER LEARNERS MARKS</h2>
      
      <!-- Step 1: Select Subject/Class Allocation -->
      <div class="marks-controls" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
        <h3>Step 1: Select Your Subject & Grade</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: flex-end;">
          <div class="form-group" style="margin: 0;">
            <label>Subject & Grade</label>
            <select id="subjectAllocationSelect" required>
              <option value="">-- Select Subject/Grade --</option>
            </select>
          </div>
          
          <div class="form-group" style="margin: 0;">
            <label>Term</label>
            <select id="marksTermSelect" required>
              <option value="">-- Select Term --</option>
              <option value="1">Term 1</option>
              <option value="2">Term 2</option>
              <option value="3">Term 3</option>
            </select>
          </div>

          <div class="form-group" style="margin: 0;">
            <label>Assessment</label>
            <select id="marksAssessmentSelect" required></select>
          </div>

          <div class="form-group" style="margin: 0;">
            <label>Year</label>
            <input type="number" id="marksYearInput" min="2025" max="2090" readonly style="background: #f0f0f0;" />
          </div>

          <button type="button" id="loadStudentsBtn" class="btn" style="margin-top: 0;">📥 Load Learners</button>
        </div>
      </div>

      <!-- Step 2: Marks Entry Table -->
      <div id="marksTableContainer" style="display: none;">
        <h3>Step 2: Enter Marks for Each Learner</h3>
        <div style="overflow-x: auto;">
          <table id="marksEntryTable" class="marks-entry-table">
            <thead>
              <tr>
                <th style="width: 5%;">ADM No</th>
                <th style="width: 10%;">Learner's Name</th>
                <th style="width: 8%;" id="marksColumnHeader">Marks</th>
              </tr>
            </thead>
            <tbody id="marksEntryTableBody">
              <!-- Students will be populated here -->
            </tbody>
          </table>
        </div>

        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" id="saveDraftBtn" class="btn" style="background: #ff9800; padding: 8px 16px;">💾 Save Draft</button>
            <button type="button" id="loadDraftBtn" class="btn" style="background: #2196f3; padding: 8px 16px; display: none;">📂 Load Draft</button>
          </div>
          <button type="button" id="submitAllMarksBtn" class="btn btn-primary" style="padding: 10px 25px; font-size: 16px;">✅ Submit All Marks</button>
        </div>

        <!-- Draft Status Indicator -->
        <div id="draftStatus" style="margin-top: 10px; padding: 8px 12px; background: #f5f5f5; border-radius: 4px; color: #666; font-size: 0.9rem; display: none;">
          ✓ Draft saved at <span id="draftTime"></span>
        </div>
      </div>
    </section>
    </div>

    <div id="submittedMarks" class="tab-pane">
    <!-- =================== SUBMITTED MARKS TABLES =================== -->
    <section class="marks-table">
      <details open style="background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; padding: 15px;">
        <summary style="cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between;">
          <h2 style="margin: 0;">📊 SUBMITTED MARKS</h2>
          <span style="font-size: 0.85rem; color: #718096; font-weight: 500;">(Click to Collapse/Expand)</span>
        </summary>
        <div style="margin-top: 20px; border-top: 1px solid #edf2f7; padding-top: 15px;">
          <input 
            type="text" 
            id="marksSearchBox" 
            placeholder="Search by name, admission, subject, grade, term..."
            class="search-input"
          />
          <div id="submittedMarksContainer"></div>
        </div>
      </details>
    </section>
    </div>

    <div id="studyMaterials" class="tab-pane">
    <!-- =================== STUDY MATERIALS =================== -->
    <section class="materials-section">
      <div class="card" style="text-align: center; padding: 40px; border: 1px dashed #ccc;">
        <h3 style="margin-top: 0;">📚 Study Materials & Assignments</h3>
        <a href="teacher-materials.html" class="btn" style="text-decoration: none; padding: 12px 24px; font-size: 1.1em; border-radius: 6px; background-color: #3498db; color: white; display: inline-block;">
          🚀 Go to Materials Dashboard
        </a>
      </div>
    </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/cbc-utils.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
