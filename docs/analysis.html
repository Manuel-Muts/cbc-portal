<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLASSTEACHER</title>

  <link rel="stylesheet" href="css/analysis.css" />
  <link rel="stylesheet" href="css/announcements.css">
  <link rel="icon" type="image/png" href="/images/favicon.png"/>

</head>

<body>
<div class="container">

  <header>
    <h1 id="schoolName">Class Analysis</h1>

    <div class="toolbar">
      <button id="refreshBtn" class="btn small">Refresh</button>
      <button id="logoutBtn" class="btn danger small">Logout</button>
    </div>
  </header>

  <div id="teacherInfo" class="teacher-info"></div>

 
  <div id="analysisWrap" class="card">

    <!-- FILTERS -->
    <div class="filter-grid">

      <div class="form-group">
        <label for="gradeFilter">Grade</label>
        <select id="gradeFilter" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="termFilter">Term</label>
        <select id="termFilter" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="yearFilter">Year</label>
        <select id="yearFilter" class="form-control"></select>
      </div>

      <div class="form-group" id="streamFilterGroup">
        <label for="streamFilterSelect">Stream</label>
        <select id="streamFilterSelect" class="form-control">
          <!--<option value="all">All Learners (Whole Class)</option>-->
          <option value="assigned">My Stream Only</option>
        </select>
      </div>

      <div class="form-group">
        <label for="assessmentFilter">Assessment</label>
        <select id="assessmentFilter" class="form-control"></select>
      </div>

      <div class="form-group">
        <button id="generateReport" class="btn primary-btn">Generate Report</button>
      </div>

    </div>

    <!-- STATS -->
    <div class="stats-summary">
      <div class="stat-card"><h4>Class Mean</h4><p id="classMean">-</p></div>
      <div class="stat-card"><h4>Pass Rate (%)</h4><p id="passRate">-</p></div>
      <div class="stat-card"><h4>Records</h4><p id="recordsCount">-</p></div>
    </div>

    <!-- TABS -->
    <div class="analysis-tabs-container" id="analysisTabsContainer">

      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="classRankingPane">Class Ranking</button>
        <button class="tab-btn" data-tab="subjectAnalysisPane">Subject Analysis</button>
        <button class="tab-btn" data-tab="trendChartPane">Trend Chart</button>
        <button class="tab-btn" data-tab="missingExamsPane">Missing Exams</button>
      </div>

      <div class="tab-content-area">

        <div class="tab-pane active" id="classRankingPane">
          <div id="rankingTableWrap" class="table-responsive"></div>
        </div>

        <div class="tab-pane" id="subjectAnalysisPane">
          <div id="subjectTableWrap" class="table-responsive"></div>
        </div>

        <div class="tab-pane" id="trendChartPane">
          <canvas id="classTrendChart"></canvas>
        </div>

        <div class="tab-pane" id="missingExamsPane">
          <div id="missingExamsTableWrap" class="table-responsive"></div>
        </div>

      </div>
    </div>

  </div>

</div>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- YOUR SCRIPTS -->
<script src="js/config.js"></script>
<script src="js/auth-service.js"></script>
<script src="js/Utility/announcements.js"></script>
<script src="js/analysis.js"></script>
<script src="js/Utility/spinner.js"></script>
<script src="js/ui.js"></script>
<script src="js/Utility/cbc-utils.js"></script>

</body>
</html>
