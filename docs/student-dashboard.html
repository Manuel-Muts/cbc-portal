<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/student.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Mobile Responsive Optimizations for Dashboard */
    @media screen and (max-width: 768px) {
      /* Stack Filter Bar elements vertically */
      .filter-bar {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      
      .filter-bar label, 
      .filter-bar select, 
      .filter-bar button {
        width: 100%;
        margin: 0 !important;
      }

      /* Dashboard Header adjustments */
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .dashboard-header .toolbar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .dashboard-header .toolbar button {
        flex: 1;
        font-size: 13px;
        padding: 8px 5px;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body> 
  <link rel="icon" type="image/png" href="/images/favicon.png"/>
  <!-- The toastContainer will be dynamically created by ui-utils.js if not present -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        <h2 id="schoolName">SCHOOL NAME</h2>
      </div>
    </div>
    <button class="sidebar-close" aria-label="Close sidebar">&times;</button>

    <ul class="menu">
      <li class="active"><a href="#"><i class="fas fa-home"></i> Dashboard</a></li>
      <li><a href="/performance"><i class="fas fa-chart-line"></i> My Performance</a></li>
      <li><a href="/study-materials"><i class="fas fa-book-open"></i> Study Materials/Assignments</a></li>
    </ul>

    <div class="sidebar-actions">
      <button id="viewFeeBtn" class="btn sidebar-fee-btn">
         Fee Structure
      </button>
      <button id="refreshBtn" class="btn sidebar-refresh-btn">
        Refresh 
      </button>
      <button id="logoutBtn" class="btn sidebar-logout-btn">
        Logout
      </button>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <div class="welcome-banner">Welcome, <span id="welcomeName">Learner</span></div>
      <div class="toolbar"></div>
    </header>

    <div id="loadingSpinner" class="loading-spinner">Loading marks...</div>

    <!-- Learner Info Display -->
    <div id="learnerInfoDisplay" class="learner-info-card">
      <p><strong>Grade:</strong> <span id="learnerGradeDisplay">Loading...</span></p>
      <p><strong>Stream:</strong> <span id="learnerStreamDisplay">N/A</span></p>
    </div>

    <div class="filter-bar">
  <label for="termFilter">
    Term:
    <select id="termFilter">
      <option value="all">All</option>
      <option value="1">Term 1</option>
      <option value="2">Term 2</option>
      <option value="3">Term 3</option>
    </select>
  </label>

  <label for="yearFilter">
    Year:
    <select id="yearFilter">
      <option value="all">All</option>
      <!-- Populated dynamically via JS -->
    </select>
  </label>

  <label for="assessmentFilter">
    Assessment:
    <select id="assessmentFilter">
      <option value="all">All</option>
    </select>
  </label>

  <button id="applyFiltersBtn" class="btn small primary">Apply Filters</button>
</div>

    <!-- TABS NAVIGATION -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="performanceTab">📈 My Performance</button>
      <button class="tab-btn" data-tab="analysisTab">📊 Component Analysis</button>
    </div>

    <div id="performanceTab" class="tab-pane active">
      <div id="learnerMarks" class="tab-content-area empty-state">Select Assessment above, then click "Apply Filters" to view your marks.</div>
    </div>

    <div id="analysisTab" class="tab-pane">
      <div id="learnerAnalysis" class="tab-content-area empty-state">Apply filters to see performance analysis.</div>
    </div>

  </main>

  <!-- Fee modal -->
  <div id="feeModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content fee-modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="margin:0;">My Fee Structure</h3>
        <div>
          <button id="downloadFeeStructurePDF" class="btn small" style="margin-right: 10px;">📄 Fee Structure PDF</button>
          <button id="downloadFeeStatementPDF" class="btn small" style="margin-right: 10px;">📄 Fee Statement PDF</button>
          <button class="cancel-btn" onclick="document.getElementById('feeModal').classList.add('hidden')">Close</button>
        </div>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="feeYearFilter" style="font-weight: bold;">Academic Year:</label>
        <select id="feeYearFilter" style="margin-left: 10px; padding: 5px;">
          <!-- Populated dynamically via JS -->
        </select>
        <button id="feeFilterBtn" class="btn small" style="margin-left: 10px;">Filter</button>
      </div>
      <div id="feeModalBody">Loading...</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/cbc-utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
