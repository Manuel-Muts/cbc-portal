<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Report Verification - CompetenceHub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #f1f5f9; color: #0f172a; font: 16px Arial, sans-serif; }
    main { width: min(560px, 100%); box-sizing: border-box; padding: 28px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    #status { color: #475569; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 12px; margin: 24px 0 0; }
    dt { color: #64748b; font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .valid { color: #047857 !important; font-weight: 700; }
    .invalid { color: #b91c1c !important; font-weight: 700; }
    @media (max-width: 420px) { dl { grid-template-columns: 1fr; gap: 5px; } dd { margin-bottom: 10px; } }
  </style>
</head>
<body>
  <main>
    <h1>Report verification</h1>
    <p id="status" role="status">Checking this report…</p>
    <dl id="reportDetails" hidden></dl>
  </main>
  <script src="js/config.js"></script>
  <script src="js/report-verification.js"></script>
</body>
</html>
