<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modals/modal.css" />
  <link rel="stylesheet" href="css/login.css" />
   <link rel="icon" type="image/png" href="/images/favicon.png"/>
   <link rel="apple-touch-icon" href="/images/favicon.png" />
   <link rel="manifest" href="/manifest.json" />
   <meta name="theme-color" content="#0f766e" />
   <meta name="mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-status-bar-style" content="default" />
   <meta name="apple-mobile-web-app-title" content="CompetenceHub" />
</head>
<body class="login-body">
  <div class="login-container minimal-floating">
   <div class="logo-container">
  <img src="/images/login.png" alt="CompetenceHub Logo" class="login-logo">
  <div class="brand-name">CompetenceHub</div>
</div>

<form id="loginForm" class="login-form">
      <div class="form-step active" data-step="1">
        <div class="form-row-header">
          <a href="/home" id="backToHome" class="back-home-link">Back to Home</a>
          <a href="/reset" id="forgotPassword" class="forgot-password-link">Forgot Password?</a>
        </div>
        <div class="role-select-wrapper">
          <button type="button" id="roleTrigger" class="role-select-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="role-select-placeholder">Select Role</span>
            <span class="role-select-arrow"><i class="fas fa-chevron-down"></i></span>
          </button>
          <div class="role-dropdown hidden" id="roleDropdown" role="listbox" aria-label="Select your role"></div>
          <input type="hidden" id="role" name="role" required>
        </div>

        <div class="form-actions step-1-row">
          <div class="form-group remember-group" id="rememberGroup">
            <input type="checkbox" id="keepLoggedIn" name="keepLoggedIn">
            <label for="keepLoggedIn">Keep me logged in</label>
          </div>
          <button type="button" id="nextButton" class="btn login-cta">Continue</button>
        </div>
      </div>

      <div class="form-step" data-step="2">
        <div class="form-group" id="firstnameGroup">
          <label for="firstname" id="firstnameLabel">Full Name</label>
          <input type="text" id="firstname" name="firstname" placeholder="Enter your full name">
        </div>

        <div class="form-group" id="emailGroup">
          <label for="email" id="emailLabel">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group" id="admissionGroup">
          <label for="admission" id="admissionLabel">Password</label>
          <input type="password" id="admission" name="admission" placeholder="Enter your password">
        </div>


        <div class="form-actions action-row">
          <button type="button" id="backButton" class="text-button">Back</button>
          <button type="button" id="stepNextButton" class="text-button">Next</button>
          <button type="submit" id="submitButton" class="btn hidden">Login</button>
        </div>
      </div>

      <div class="login-footer-links">
      </div>
    </form>
  </div>

  <!-- Change Password Modal -->
  <div id="changePasswordModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="document.getElementById('changePasswordModal').classList.add('hidden')">&times;</span>
      <h3>Change your password</h3>
      <form id="changePasswordForm">
        <div id="currentPasswordField" class="form-group">
          <input type="password" name="currentPassword" placeholder="Current password">
        </div>
        <div class="form-group">
          <input type="password" name="newPassword" placeholder="New password" required minlength="8">
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
          <button type="button" id="cancelChangePasswordBtn" class="btn secondary-btn">Cancel</button>
          <button type="submit" class="btn">Update</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://competence-hub.onrender.com/js/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/Utility/spinner.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Logic to handle auto-selecting role from URL parameters
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      if (role) {
        const roleSelect = document.getElementById('role');
        roleSelect.value = role;
        // Dispatch change event so login.js updates the UI (hides/shows Email vs Name)
        roleSelect.dispatchEvent(new Event('change'));
      }
    });
  </script>
    <footer>
    <p>
© Muts Tech· Secure CBE Education Platform ·
<script>document.write(new Date().getFullYear());</script>
</p>
  </footer>
</body>
</html>
