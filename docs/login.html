<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/modals/modal.css" />
  <link rel="stylesheet" href="css/login.css" />
   <link rel="icon" type="image/png" href="/images/favicon.png"/>
   <link rel="apple-touch-icon" href="/images/child-head.png" />
   <link rel="manifest" href="/manifest.json" />
   <meta name="theme-color" content="#0f766e" />
   <meta name="mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-status-bar-style" content="default" />
   <meta name="apple-mobile-web-app-title" content="CompetenceHub" />
</head>
<body class="login-body">
  <div class="login-container">
   <div class="logo-container">
  <img src="/images/favicon.png" alt="Competence Hub Logo" class="login-logo">
  <div class="brand-name">CompetenceHub</div>
</div>

<form id="loginForm" class="login-form">
      <label for="role">Select Role</label>
      <select id="role" name="role" required>
        <option value="">-- Select Role --</option>
        <option value="learner">Learner</option>
        <option value="teacher">Teacher</option>
        <option value="classteacher">Class Teacher</option>
        <option value="accounts">Accounts</option>
        <option value="admin">Admin</option>
      </select>

      <!-- LEARNER FIELD -->
          <div class="form-group">
      <label for="firstname" id="firstnameLabel" style="display:none;">Full Name</label>
      <input type="text" id="firstname" name="firstname" placeholder="Enter your full name" style="display:none;">
          </div>
          
      <!-- EMAIL FOR TEACHERS/ADMIN -->
      <div class="form-group">
        <label for="email" id="emailLabel" style="display:none;">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" style="display:none;">
      </div>

      <!-- ADMISSION / PASSWORD FIELD -->
      <div class="form-group">
        <label for="admission" id="admissionLabel">Password</label>
        <input type="password" id="admission" name="admission" placeholder="Enter your password" required>
      </div>
      
      <div class="form-group" style="margin-top: 15px; display: flex; align-items: center;">
        <input type="checkbox" id="keepLoggedIn" name="keepLoggedIn" style="width: auto; margin-right: 8px;">
        <label for="keepLoggedIn" style="margin-bottom: 0; font-weight: normal; color: #555;">Keep me logged in</label>
      </div>

      <button type="submit" class="btn" >Login</button>

      <div class="login-footer-links">
        <a href="/reset" id="forgotPassword">Forgot Password?</a>
        <a href="/home" id="backToHome">Back to Home</a>
      </div>
    </form>
  </div>

  <!-- Change Password Modal -->
  <div id="changePasswordModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="document.getElementById('changePasswordModal').classList.add('hidden')">&times;</span>
      <h3>Change your password</h3>
      <form id="changePasswordForm">
        <div id="currentPasswordField" class="form-group">
          <input type="password" name="currentPassword" placeholder="Current password">
        </div>
        <div class="form-group">
          <input type="password" name="newPassword" placeholder="New password" required minlength="8">
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
          <button type="button" id="cancelChangePasswordBtn" class="btn secondary-btn">Cancel</button>
          <button type="submit" class="btn">Update</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://competence-hub.onrender.com/js/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/Utility/spinner.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Logic to handle auto-selecting role from URL parameters
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role');
      if (role) {
        const roleSelect = document.getElementById('role');
        roleSelect.value = role;
        // Dispatch change event so login.js updates the UI (hides/shows Email vs Name)
        roleSelect.dispatchEvent(new Event('change'));
      }
    });
  </script>
    <footer>
    <p>
© Muts Tech· Secure CBE Education Platform ·
<script>document.write(new Date().getFullYear());</script>
</p>
  </footer>
</body>
</html>
