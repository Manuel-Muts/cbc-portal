<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEAN DASHBOARD</title>
  <link rel="stylesheet" href="css/teachers.css" />
  <link rel="stylesheet" href="css/dean.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077012.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
      <h1>DEAN DASHBOARD</h1>
      <a href="teacher-dashboard.html" class="btn secondary-btn" style="text-decoration: none;">← Teacher Dashboard</a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="darkModeToggle" class="btn secondary-btn" title="Toggle Dark Mode">🌙</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div id="toastContainer"></div>

  <main>
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Status</h3>
        <p id="deanStatus">Checking authorization...</p>
      </div>
    </section>
    <section class="filters-section">
      <h3>Oversight Filters</h3>
      <div class="filter-grid">
        <div class="filter-group">
          <label>Grade</label>
          <select id="filterGrade">
            <option value="">-- All Grades --</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Term</label>
          <select id="filterTerm">
            <option value="1">Term 1</option>
            <option value="2">Term 2</option>
            <option value="3">Term 3</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Assessment</label>
          <select id="filterAssessment"></select>
        </div>
        <div class="filter-group">
          <label>Year</label>
          <input type="number" id="filterYear" readonly>
        </div>
        <button id="applyFiltersBtn">🔍 View Results</button>
      </div>
    </section>

    <section id="analysisSection" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card stat-mean">
          <h4>Class Mean</h4>
          <p id="classMean">-</p>
        </div>
        <div class="stat-card stat-top" title="Percentage of students meeting or exceeding expectations (Mean Score >= 41%)">
          <h4>Pass Rate</h4>
          <p id="passRate">-</p>
        </div>
        <div class="stat-card stat-top" title="Learner with the highest average score">
          <h4>Top Learner</h4>
          <p id="topLearner">-</p>
        </div>
        <div class="stat-card stat-low" title="Learner with the lowest average score">
          <h4>Lowest Learner</h4>
          <p id="lowLearner">-</p>
        </div>
        <div class="stat-card stat-top" title="Subject with the highest mean score">
          <h4>Top Subject</h4>
          <p id="topSubject">-</p>
        </div>
        <div class="stat-card stat-low" title="Subject with the lowest mean score">
          <h4>Lowest Subject</h4>
          <p id="lowSubject">-</p>
        </div>
        <div class="stat-card stat-entries" title="Total number of students analyzed">
          <h4>Entries</h4>
          <p id="recordsCount">0</p>
        </div>
      </div>

      <div class="dashboard-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="margin: 0;">Grade Ranking Report</h3>
          <button id="printReportBtn" class="btn primary-btn" style="padding: 6px 12px; font-size: 0.85rem; display: none;">📄 Print PDF</button>
        </div>
        <div id="rankingTableWrap"></div>
      </div>
      
      <div id="subjectTableContainer" class="dashboard-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="margin: 0;">Subject Performance</h3>
          <button id="printSubjectReportBtn" class="btn primary-btn" style="padding: 6px 12px; font-size: 0.85rem;">📄 Print PDF</button>
        </div>
        <div id="subjectTableWrap"></div>
      </div>

    <div class="dashboard-card">
        <h3>Performance Trend</h3>
        <div class="chart-wrap"><canvas id="gradeTrendChart"></canvas></div>
      </div>
    </section>

    

  </main>

  <script src="js/config.js"></script>
  <script src="js/dean.js"></script>
  <script src="js/cbc-utils.js"></script>
</body>
</html>
