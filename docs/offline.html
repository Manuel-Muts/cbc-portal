<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CompetenceHub - Offline</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      color: #0f172a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14);
      padding: 28px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fef3c7;
      font-size: 28px;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 10px; font-size: 1.7rem; }
    p { margin: 0 0 16px; line-height: 1.6; color: #475569; }
    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f766e, #2563eb);
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">📡</div>
    <h1>No internet connection</h1>
    <p>CompetenceHub is currently offline. The app will reconnect automatically when your connection is back.</p>
    <a class="btn" href="/">Try again</a>
  </div>
</body>
</html>
