# netlify.toml for CBE Student Portal (Optimized for multi-page)

[build]
  publish = "docs"

# -------------------------
# Specific page redirects
# -------------------------

# Force clean URLs by redirecting .html requests to clean paths
[[redirects]]
  from = "/analysis.html"
  to = "/analysis"
  status = 301

[[redirects]]
  from = "/dean-dashboard.html"
  to = "/dean"
  status = 301

